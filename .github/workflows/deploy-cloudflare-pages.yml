name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lovable-ui/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch: {}

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lovable-ui
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lovable-ui/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js for Cloudflare Pages
        run: npm run cf:build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@3 pages deploy \
            .vercel/output/static \
            --project-name "$CF_PAGES_PROJECT" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --branch "${{ github.ref_name }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message || 'CI deploy' }}"

      - name: Output Preview/Production URL
        if: always()
        run: echo "Deployment triggered for branch ${{ github.ref_name }}"